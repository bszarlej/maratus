  - networking
  - gamedev
  - webrtc

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  maratus: ^0.2.0
  web: ^1.1.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
