name: maratus_generator
description: >-
  Generates maratus protocol handles, schema registration, RPC and property
  bindings, typed RPC senders, and value codecs from maratus_annotations.
version: 0.1.1
repository: https://github.com/bszarlej/maratus/tree/master/packages/maratus_generator
issue_tracker: https://github.com/bszarlej/maratus/issues
topics:
  - multiplayer
  - networking
  - gamedev
  - codegen
  - build-runner

# Lower bounds are exercised by the minimum-SDK job in
# .github/workflows/ci.yaml. Keep them in sync.
environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  analyzer: '>=8.4.0 <15.0.0'
  build: '>=4.0.4 <6.0.0'
  maratus_annotations: ^0.1.1
  source_gen: ^4.2.4

dev_dependencies:
  build_runner: ^2.15.1
  build_test: ^3.5.16
  lints: ^6.0.0
  maratus: ^0.1.2
  test: ^1.26.3
