name: Tag release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tag-release:
    name: Create tags for release
    if: contains(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.x
          cache: true

      - uses: bluefireteam/melos-action@v3
        with:
          melos-version: ^8.10.0
          tag: true

      # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the
      # publish workflow is dispatched on each unpublished package's tag.
      - name: Trigger publish for unpublished packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          melos exec -c1 --no-published --no-private -- \
            gh workflow run release-publish.yaml \
            --ref \$MELOS_PACKAGE_NAME-v\$MELOS_PACKAGE_VERSION
