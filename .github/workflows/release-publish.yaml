name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-packages:
    name: Publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # Required for pub.dev authentication using OIDC.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - uses: bluefireteam/melos-action@v3
        with:
          melos-version: ^8.10.0
          publish: true
          create-release: true
