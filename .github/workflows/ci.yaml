name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Flutter ${{ matrix.flutter }} (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            flutter: 3.41.0
            resolve: downgrade
            current: false

          - name: current
            flutter: 3.47.x
            resolve: get
            current: true
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Downgrade direct dependencies
        if: matrix.resolve == 'downgrade'
        run: flutter pub downgrade crypto web flame flame_test flutter_lints lints melos test

      - name: Check formatting
        if: matrix.current
        run: dart run melos format --no-private --output=none --set-exit-if-changed

      - name: Analyze
        run: dart run melos analyze --no-private --fatal-infos

      - name: Test
        run: dart run melos test --no-private

      - name: Test browser connections to native host
        if: matrix.current
        run: dart run melos run test:browser --no-select

  dart-only:
    name: maratus on Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 3.11.0
            resolve: downgrade
          - sdk: stable
            resolve: get
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Copy the package out of the workspace
        run: |
          cp -r packages/maratus "$RUNNER_TEMP/maratus"
          sed -i '/^resolution: workspace$/d' "$RUNNER_TEMP/maratus/pubspec.yaml"

      - name: Resolve dependencies
        working-directory: ${{ runner.temp }}/maratus
        run: dart pub get

      - name: Downgrade direct dependencies
        if: matrix.resolve == 'downgrade'
        working-directory: ${{ runner.temp }}/maratus
        run: dart pub downgrade crypto web lints test

      - name: Analyze
        working-directory: ${{ runner.temp }}/maratus
        run: dart analyze --fatal-infos

      - name: Test
        working-directory: ${{ runner.temp }}/maratus
        run: dart test
