name: maratus_workspace
publish_to: none

# The minimum-SDK job in .github/workflows/ci.yaml exercises this bound.
environment:
  sdk: ^3.11.0

workspace:
  - packages/maratus
  - packages/maratus_annotations
  - packages/maratus_enet
  - packages/maratus_flame
  - packages/maratus_generator
  - packages/maratus_webrtc
  - examples/chat
  - examples/prediction

dev_dependencies:
  melos: ^8.10.0

melos:
  repository: https://github.com/bszarlej/maratus

  command:
    version:
      includeScopes: false

  scripts:
    check-format:
      description: Fail if any Dart file in the workspace is not formatted.
      run: dart run melos format --output=none --set-exit-if-changed

    generate:
      description: >-
        Regenerate the code that maratus_generator writes for the packages'
        examples and tests.
      exec:
        command: dart run build_runner build
        concurrency: 1
      packageFilters:
        dependsOn: build_runner

    test:browser:
      description: >-
        Run the browser WebSocket tests against a native loopback host.
        Requires Chrome; set CHROME_EXECUTABLE if it is not found.
      exec:
        command: dart run tool/test_web_socket_browser.dart
      packageFilters:
        scope: maratus
